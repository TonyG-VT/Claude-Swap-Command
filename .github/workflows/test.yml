name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Swap-Command-macos
          path: dist/Claude-Swap-Command-macos.zip*
